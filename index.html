<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baca Al-Qur'an Lengkap</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f9f9f9;
    margin: 0;
    padding: 0;
}
.container {
    max-width: 700px;
    margin: auto;
    padding: 20px;
}
header {
    text-align: center;
    padding: 15px 0;
    background: #16a085;
    color: white;
    font-size: 24px;
    font-weight: bold;
}
select {
    width: 100%;
    padding: 10px;
    margin-top: 15px;
    font-size: 16px;
}
audio {
    width: 100%;
    margin-top: 15px;
}
.arabic {
    font-size: 28px;
    line-height: 1.8;
    direction: rtl;
    text-align: right;
    margin-top: 10px;
}
.translation {
    margin-top: 8px;
    color: #333;
    font-size: 16px;
}
hr {
    border: none;
    border-top: 1px solid #ddd;
    margin: 15px 0;
}
</style>
</head>
<body>

<header>📖 Baca Al-Qur'an (114 Surah)</header>

<div class="container">

    <label for="surahList">Pilih Surah:</label>
    <select id="surahList"></select>

    <audio id="audioPlayer" controls></audio>

    <div id="surahText"></div>

</div>

<script>
const surahListEl = document.getElementById("surahList");
const audioPlayerEl = document.getElementById("audioPlayer");
const surahTextEl = document.getElementById("surahText");

// 1. Ambil list 114 surah
fetch("https://api.alquran.cloud/v1/surah")
.then(res => res.json())
.then(data => {
    data.data.forEach(surah => {
        const opt = document.createElement("option");
        opt.value = surah.number;
        opt.textContent = `${surah.number}. ${surah.englishName} (${surah.name})`;
        surahListEl.appendChild(opt);
    });
    // load surah pertama
    loadSurah(1);
});

// 2. Tampilkan surah
function loadSurah(num) {
    // fetch teks ayat
    fetch(`https://api.alquran.cloud/v1/surah/${num}/quran-uthmani`)
    .then(res => res.json())
    .then(resText => {
        // fetch recitation audio
        fetch(`https://api.alquran.cloud/v1/surah/${num}/ar.alafasy`)
        .then(resAudio => resAudio.json())
        .then(resA => {

            // set audio file (per surah)
            if(resA.data && resA.data.audioSecondary && resA.data.audioSecondary[0]) {
                audioPlayerEl.src = resA.data.audioSecondary[0];
            } else {
                audioPlayerEl.src = "";
            }

            // render ayat
            let html = `<h2>${resText.data.englishName} — ${resText.data.name}</h2>`;
            resText.data.ayahs.forEach(ayah => {
                html += `
                <div class="arabic">${ayah.text}</div>
                <div class="translation">(${ayah.numberInSurah})</div>
                <hr>`;
            });
            surahTextEl.innerHTML = html;
        });
    });
}

// 3. Event pilihan surah
surahListEl.onchange = function() {
    loadSurah(this.value);
};
</script>

</body>
</html>
